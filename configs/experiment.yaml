experiment:
  conditions:
    - name: "neutral_baseline"
      steering: false
      persona_prompt: false
    - name: "prompt_baseline"
      steering: false
      persona_prompt: true
    - name: "as_only"
      steering: true
      persona_prompt: false

  personas: ["aggressive", "cooperative"]
  num_scenarios: 10
  num_repeats: 30
  total_runs_per_condition: 600

  generation:
    max_new_tokens: 128
    temperature: 0.7
    top_p: 0.9
    do_sample: true

  seed: 42

  output:
    raw_dir: "results/raw"
    metrics_dir: "results/metrics"
    figures_dir: "results/figures"
    vectors_dir: "results/vectors"
