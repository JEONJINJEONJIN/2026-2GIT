experiment:
  conditions:
    - name: "neutral_baseline"
      steering: false
      persona_prompt: false
    - name: "prompt_baseline"
      steering: false
      persona_prompt: true
    - name: "as_only_neg"
      steering: true
      persona_prompt: false
      vector_mode: "contrast_negated"
    - name: "as_only_sep"
      steering: true
      persona_prompt: false
      vector_mode: "contrast_explicit"
    - name: "prompt_as"
      steering: true
      persona_prompt: true
      vector_mode: "contrast_explicit"

  personas: ["aggressive", "cooperative"]
  num_scenarios: 30
  num_repeats: 1
  total_runs_per_condition: 60

  generation:
    max_new_tokens: 128
    temperature: 0.7
    top_p: 0.9
    do_sample: true

  seed: 42

  output:
    raw_dir: "results/v2/raw"
    metrics_dir: "results/v2/metrics"
    figures_dir: "results/v2/figures"
    vectors_dir: "results/v2/vectors"
