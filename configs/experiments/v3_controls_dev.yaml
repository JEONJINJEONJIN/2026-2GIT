experiment:
  name: "v3_controls_dev"
  purpose: "Evaluate persona-specific activation steering against zero, random, and wrong-persona vector controls on the dev split."
  version: "v3"
  split: "dev"

  personas: ["aggressive", "cooperative"]
  conditions:
    - name: "neutral_baseline"
      persona_prompt: false
      steering: false
    - name: "zero_hook"
      persona_prompt: false
      steering: true
      vector_mode: "zero"
    - name: "random_vector"
      persona_prompt: false
      steering: true
      vector_mode: "random_normalized"
    - name: "wrong_persona_vector"
      persona_prompt: false
      steering: true
      vector_mode: "wrong_persona"
    - name: "as_only"
      persona_prompt: false
      steering: true
      vector_mode: "contrast_explicit"
    - name: "weak_prompt_baseline"
      persona_prompt: "weak"
      steering: false
    - name: "weak_prompt_as"
      persona_prompt: "weak"
      steering: true
      vector_mode: "contrast_explicit"
    - name: "strong_prompt_baseline"
      persona_prompt: "strong"
      steering: false
    - name: "strong_prompt_as"
      persona_prompt: "strong"
      steering: true
      vector_mode: "contrast_explicit"

  steering:
    alpha_values: [0.5, 1.0, 2.0, 4.0, 8.0]
    layer_groups:
      early: [6, 9]
      middle: [18, 21, 24]
      late: [30, 33, 35]
    tune_on_this_split: true

  scoring:
    modes: ["loglik"]
    primary_metric: "aligned_probability_mass"
    use_action_paraphrases: true
    aggregate_paraphrases: "mean"
    report_top1_alignment: true
    report_rank_metrics: true
    report_margin_metrics: true

  data:
    scenarios_path: "data/scenarios/team_a_scenarios.jsonl"
    actions_path: "data/actions/team_a_action_definitions.jsonl"
    require_split: true
    allowed_splits: ["dev"]

  output:
    run_root: "results/v3/runs"
