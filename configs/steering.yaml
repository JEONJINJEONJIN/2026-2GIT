# Steering configuration
steering:
  # Alpha: layer-wise injection strength
  alpha_presets:
    pilot: [1.0, 2.0, 4.0]
    fine: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0]

  # Layer groups for sweep (Gemma4-E4B: 42 layers)
  layer_groups:
    shallow: [6, 9, 12]
    middle: [18, 21, 24]
    deep: [30, 33, 36]

  # Beta: position-wise injection strength
  beta_strategies:
    uniform:
      speech: 1.0
      action: 1.0
    action_boosted:
      speech: 1.0
      action: 2.0
    action_only:
      speech: 0.0
      action: 1.0

  # Activation extraction
  extraction:
    token_position: "last"        # last token of input
    representation: "residual"    # residual stream (block output)

  # Persona directions
  personas:
    aggressive:
      positive: "aggressive"
      negative: "cooperative"
    cooperative:
      positive: "cooperative"
      negative: "aggressive"
