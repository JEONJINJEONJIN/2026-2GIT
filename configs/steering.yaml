steering:
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  hook_target: "post_block_residual"
  token_aggregation: "last_input_token"
  normalize_vectors: true
  default_alpha: 2.0
  alpha_values: [0.5, 1.0, 2.0, 4.0]
  vector_path: "results/vectors/steering_vectors_fp16.pt"

  layer_groups:
    shallow: [6, 9, 12]
    middle: [18, 21, 24]
    deep: [30, 33, 35]
    all: [6, 9, 12, 18, 21, 24, 30, 33, 35]

  extraction:
    token_position: "last"
    representation: "post_block_residual"
    contrastive_pairs_path: "data/contrastive_pairs/aggressive_cooperative.jsonl"

  personas:
    aggressive:
      positive: "aggressive"
      negative: "cooperative"
    cooperative:
      positive: "cooperative"
      negative: "aggressive"
