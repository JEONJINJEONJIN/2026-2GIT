# Model configuration
model:
  name: "google/gemma-4-E4B-it"
  backup: "Qwen/Qwen2.5-3B-Instruct"
  device: "cuda"
  dtype: "bfloat16"          # gemma4 uses bfloat16
  quantization: null         # null for full precision, "4bit" for bitsandbytes
  load_in_4bit: false
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  trust_remote_code: true
  max_memory: null           # e.g. {0: "14GiB"} for explicit VRAM limit

# Layer info (Gemma4-E4B: 42 layers, hidden_dim=2560)
architecture:
  num_layers: 42
  hidden_dim: 2560
  layers_path: "language_model.model.layers"  # multimodal model structure
